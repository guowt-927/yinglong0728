  <div class="toast hidden" id="toast" role="status" aria-live="polite"><svg class="icon"><use href="#i-check"/></svg><div><h3 id="toastTitle">操作成功</h3><p id="toastMessage"></p></div></div>
  <script>
    const assets = {
      'qwen-72b': { name:'Qwen-72B', provider:'Alibaba Cloud · 通用大模型', mark:'Q', versions:[['v2.1.0','144 GB','2026-08-12 16:40','latest'],['v2.0.5','142 GB','2026-07-28 09:15','stable'],['v2.0.0','142 GB','2026-06-18 14:26','stable'],['v1.8.2','138 GB','2026-05-09 11:32','archived']] },
      'deepseek-r1': { name:'DeepSeek-R1', provider:'DeepSeek · 推理模型', mark:'D', versions:[['v1.0.0','128 GB','2026-08-10 11:25','latest'],['v0.9.5-beta','126 GB','2026-07-22 17:08','stable'],['v0.9.0','124 GB','2026-06-30 10:12','archived']] }
    };
    const modelId = new URLSearchParams(location.search).get('model') || 'qwen-72b';
    const asset = assets[modelId] || assets['qwen-72b'];
    const stateLabel = { latest:['badge-success','最新'], stable:['badge-info','稳定'], archived:['badge-neutral','归档'] };
    document.getElementById('pageTitle').textContent = asset.name + ' 版本历史';
    document.getElementById('versionTableTitle').textContent = asset.name;
    document.getElementById('versionModelMark').innerHTML = '<span>' + asset.mark + '</span>';
    document.getElementById('versionCount').textContent = asset.versions.length;
    document.getElementById('versionPagination').textContent = '共 ' + asset.versions.length + ' 个版本';
    document.getElementById('versionTableBody').innerHTML = asset.versions.map(([version,size,updated,state]) => `<tr><td><div class="version-cell"><strong class="mono">${version}</strong><span class="badge ${stateLabel[state][0]}">${stateLabel[state][1]}</span></div></td><td class="mono">${size}</td><td class="muted">${updated}</td><td><div class="actions"><button class="text-link" type="button" data-deploy-open data-deploy-mode="deploy" data-deploy-model="${asset.name}" data-deploy-version="${version}" data-deploy-service="svc-${modelId}-${version.replace(/[^a-z0-9]/gi,'-').toLowerCase()}"><svg class="icon icon-sm"><use href="#i-rocket"/></svg>部署</button><a class="text-link" href="sys_model_training_detail.html?model=${encodeURIComponent(modelId)}&record=${encodeURIComponent(version)}">训练记录</a></div></td></tr>`).join('');
    function showToast(title,message){document.getElementById('toastTitle').textContent=title;document.getElementById('toastMessage').textContent=message;document.getElementById('toast').classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>document.getElementById('toast').classList.add('hidden'),3000)}
  </script>
