<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务精细化配置 - 应龙大模型推理平台</title>
    <link href="assets/css/tailwind.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome-compat.css">
    <link rel="stylesheet" href="assets/css/sherlock-theme.css">
    <link rel="stylesheet" href="assets/css/yl-regular-toolbar.css">
</head>
<body class="modal-preview bg-gray-800 flex items-center justify-center h-screen">

<!-- Modal Container -->
<div class="bg-white w-full max-w-5xl h-[85vh] rounded-2xl shadow-2xl flex overflow-hidden">
    
    <!-- Left: Context Sidebar -->
    <div class="w-72 bg-gray-50 border-r border-gray-200 p-6 flex flex-col">
        <div class="mb-6">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">当前任务</span>
            <h2 class="text-xl font-bold text-gray-800 mt-2">文档翻译 Batch-A</h2>
            <div class="mt-2 flex items-center gap-2">
                <span class="px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">离线批处理</span>
                <span class="text-xs text-gray-500">ID: job-2310-012</span>
            </div>
        </div>
        
        <div class="mb-6">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">所属模型</span>
            <div class="mt-2 text-sm font-medium text-gray-700"><i class="fa-solid fa-cube mr-1 text-gray-400"></i> Qwen-72B</div>
        </div>

        <div class="flex-1">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">当前队列位置</span>
            <div class="mt-3 space-y-2">
                <div class="p-3 rounded bg-blue-50 border border-blue-500 text-blue-700 text-sm font-bold shadow-sm flex items-center relative">
                    <i class="fa-solid fa-layer-group w-6 text-center mr-2"></i> 公共队列池
                    <span class="absolute right-2 top-3 text-xs bg-blue-200 px-1.5 rounded">12%</span>
                </div>
                <div class="p-3 rounded border border-gray-200 text-gray-400 text-sm flex items-center">
                    <i class="fa-solid fa-crown w-6 text-center mr-2"></i> VIP 队列
                </div>
            </div>
        </div>
        
        <div class="pt-6 border-t border-gray-200">
            <button onclick="history.back()" class="flex items-center text-gray-500 hover:text-gray-800 text-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> 返回调度看板
            </button>
        </div>
    </div>

    <!-- Center: Adjustment Console -->
    <div class="flex-1 p-8 flex flex-col border-r border-gray-200">
        <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-sliders-h text-blue-600"></i> 调度配置
        </h2>
        
        <!-- Target Queue -->
        <div class="mb-8">
            <label class="block text-sm font-bold text-gray-700 mb-4">目标队列迁移</label>
            <div class="grid grid-cols-2 gap-4">
                 <label class="cursor-pointer group relative">
                    <input type="radio" name="target_q" value="public" checked class="peer hidden" onchange="updateUI('public')">
                    <div class="border-2 border-gray-200 rounded-xl p-4 h-full flex flex-col items-center justify-center transition-all peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:border-blue-200">
                        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-xl mb-3"><i class="fa-solid fa-layer-group"></i></div>
                        <div class="font-bold text-gray-700">保持公共</div>
                        <p class="text-xs text-center text-gray-500 mt-1">动态权重竞争</p>
                    </div>
                    <div class="absolute top-2 right-2 text-blue-500 opacity-0 peer-checked:opacity-100"><i class="fa-solid fa-check-circle"></i></div>
                </label>
                
                 <label class="cursor-pointer group relative">
                    <input type="radio" name="target_q" value="vip" class="peer hidden" onchange="updateUI('vip')">
                    <div class="border-2 border-gray-200 rounded-xl p-4 h-full flex flex-col items-center justify-center transition-all peer-checked:border-yellow-500 peer-checked:bg-yellow-50 hover:border-yellow-200">
                        <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center text-yellow-600 text-xl mb-3"><i class="fa-solid fa-crown"></i></div>
                        <div class="font-bold text-gray-700">提优至 VIP</div>
                        <p class="text-xs text-center text-gray-500 mt-1">独占配额</p>
                    </div>
                    <div class="absolute top-2 right-2 text-yellow-500 opacity-0 peer-checked:opacity-100"><i class="fa-solid fa-check-circle"></i></div>
                </label>
            </div>
        </div>

        <!-- Quota Adjustment (Dynamic Content) -->
        <div class="mb-8 p-6 bg-gray-50 rounded-xl border border-gray-100 min-h-[160px]" id="quotaSection">
            <!-- Content Injected by JS -->
        </div>

        <div class="mt-auto flex justify-end gap-3 pt-6 border-t border-gray-100">
             <button onclick="history.back()" class="px-5 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium">取消</button>
             <button onclick="alert('配置已应用'); history.back()" class="px-5 py-2 rounded-lg bg-blue-600 text-white shadow hover:bg-blue-700 font-medium flex items-center gap-2">
                <i class="fa-solid fa-save"></i> 应用更改
             </button>
        </div>
    </div>

    <!-- Right: Simulation -->
    <div class="w-80 bg-gray-50 p-6 flex flex-col overflow-y-auto">
        <h3 class="text-sm font-bold text-gray-600 uppercase mb-6 flex items-center gap-2">
            <i class="fa-solid fa-flask text-purple-500"></i> 预测模拟
        </h3>
        
        <div class="space-y-6">
            <!-- Target Task Impact -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 relative overflow-hidden">
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500"></div>
                <h4 class="font-bold text-gray-800 mb-3 text-sm">目标任务预测</h4>
                
                <div class="flex justify-between text-sm mb-2 pb-2 border-b border-gray-100">
                    <span class="text-gray-500">原定完成:</span>
                    <span class="font-mono">18:00</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500">调整后:</span>
                    <span class="font-bold text-blue-600 font-mono bg-blue-50 px-2 py-0.5 rounded">18:00</span>
                </div>
                <div class="mt-2 text-xs text-gray-400 text-center">
                    (无显著变化)
                </div>
            </div>

            <!-- Global Impact Warning -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-red-100">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fa-solid fa-exclamation-triangle text-red-500"></i>
                    <h4 class="font-bold text-gray-800 text-sm">挤压效应预警</h4>
                </div>
                
                <p class="text-xs text-gray-500 mb-3 leading-relaxed">
                    若将此任务提优至 VIP (配额 > 30%)，预计以下任务将受到影响：
                </p>

                <div class="space-y-2">
                    <div class="flex justify-between items-center text-xs p-2 bg-red-50 rounded border border-red-100">
                        <span class="text-gray-700 truncate max-w-[120px]">公共池任务 B</span>
                        <span class="text-red-600 font-bold">+1h 延迟</span>
                    </div>
                    <div class="flex justify-between items-center text-xs p-2 bg-red-50 rounded border border-red-100">
                        <span class="text-gray-700 truncate max-w-[120px]">公共池任务 C</span>
                        <span class="text-red-600 font-bold">+45m 延迟</span>
                    </div>
                </div>
            </div>
            
            <!-- Chart Placeholder -->
             <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h4 class="font-bold text-gray-800 mb-3 text-sm">公共池积压趋势</h4>
                <div class="h-24 bg-gray-50 rounded flex items-end justify-between px-2 pb-2">
                    <div class="w-1/5 bg-blue-200 h-1/3 rounded-t"></div>
                    <div class="w-1/5 bg-blue-300 h-1/2 rounded-t"></div>
                    <div class="w-1/5 bg-blue-400 h-2/3 rounded-t"></div>
                    <div class="w-1/5 bg-red-400 h-full rounded-t relative group cursor-help">
                        <div class="absolute bottom-full mb-1 left-1/2 -translate-x-1/2 bg-black text-white text-[10px] px-1 py-0.5 rounded opacity-0 group-hover:opacity-100 transition">High</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    function updateUI(mode) {
        const container = document.getElementById('quotaSection');
        let html = '';

        if (mode === 'public') {
            html = `
                <div class="text-center h-full flex flex-col justify-center">
                    <h4 class="font-bold text-gray-600 mb-4">配额预览 (当前策略)</h4>
                    <div class="flex h-6 w-full rounded-full overflow-hidden bg-gray-200 mb-2">
                        <div class="bg-green-500 w-[10%] group relative" title="在线: 10%"></div>
                        <div class="bg-blue-500 w-[60%] group relative" title="公共: 60%"></div>
                        <div class="bg-yellow-500 w-[30%] group relative" title="VIP: 30%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500 px-1">
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> 在线 10%</div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 公共 60%</div>
                        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-500"></span> VIP 30%</div>
                    </div>
                    <p class="text-xs text-gray-400 mt-4"><i class="fa-solid fa-lock mr-1"></i> 公共队列任务共享配额，不可单独调整。</p>
                </div>
            `;
        } else if (mode === 'online') {
            html = `
                <div class="flex justify-between items-center mb-4">
                    <label class="block text-sm font-bold text-gray-700">在线队列总配额调整 (全局)</label>
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">当前: 10%</span>
                </div>
                <div class="relative pt-6 pb-2">
                    <input type="range" min="0" max="80" value="10" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-500 relative z-10">
                    <div class="flex justify-between text-xs text-gray-400 mt-2 font-mono">
                        <span>0%</span>
                        <span>20%</span>
                        <span>40%</span>
                        <span>60%</span>
                        <span>80%</span>
                    </div>
                </div>
                <p class="text-xs text-gray-500 mt-4"><i class="fa-solid fa-info-circle mr-1"></i> 调整全局在线队列配额，适用于需要极低延迟的实时任务。</p>
            `;
        } else if (mode === 'vip') {
            html = `
                <div class="flex justify-between items-center mb-4">
                    <label class="block text-sm font-bold text-gray-700">新增 VIP 队列单独配额</label>
                    <span class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded" id="vipTotalText">Total VIP: 30% + 5% = 35%</span>
                </div>
                <div class="relative pt-6 pb-2">
                    <input type="range" min="0" max="20" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-yellow-500 relative z-10" oninput="updateVipTotal(this.value)">
                    <div class="flex justify-between text-xs text-gray-400 mt-2 font-mono">
                        <span>+0%</span>
                        <span>+5%</span>
                        <span>+10%</span>
                        <span>+15%</span>
                        <span>+20%</span>
                    </div>
                </div>
                <p class="text-xs text-gray-500 mt-4"><i class="fa-solid fa-info-circle mr-1"></i> 增加的配额将专门用于此任务，并从公共池中扣除。</p>
            `;
        }

        container.innerHTML = html;
    }
    
    function updateVipTotal(val) {
        document.getElementById('vipTotalText').textContent = `Total VIP: 30% + ${val}% = ${30 + parseInt(val)}%`;
    }

    // Init with default
    updateUI('public');
</script>
</body>
</html>
