function seedRequests(){return[{id:'RA-202607-008',name:'智能客服正式部署资源申请',type:'正式资源',department:'客户运营部 / 智能客服项目组',system:'智能客服中台',applicant:'刘明',operator:'李四',operatorAccount:'li.si',purpose:'承载智能客服生产问答推理服务，支撑热线坐席和在线客服高峰时段自动应答。',gpuType:'L40',gpuCount:8,status:'审核中',createdAt:'2026-07-28 10:05',updatedAt:'2026-07-28 10:18',model:'Yinglong-Chat-72B',trialPassed:'是，已完成试用验证',trialConclusion:'试用阶段意图识别准确率达到 91.6%，平均首字延迟满足上线要求，申请转正式部署。',qps:80,concurrency:200,launchTime:'2026-08-20T10:00',materials:[...materials],notes:'需要生产环境命名空间、灰度发布权限和服务日志查看权限。',allocation:{account:'li.si',clusters:['生产环境集群 A'],namespace:'cs-prod',gpuType:'L40',gpuCount:8,permissions:['查看服务','部署与更新','查看日志','查看监控']}},{id:'RA-202607-009',name:'合同解析模型试运行资源',type:'试用资源',department:'法务科技部 / 合同审阅项目组',system:'合同智能审阅',applicant:'赵琪',operator:'陈晨',operatorAccount:'chen.chen',purpose:'验证合同解析模型对扫描件、附件表格和补充条款的抽取准确率。',gpuType:'A10',gpuCount:2,status:'已提交',createdAt:'2026-07-28 09:36',updatedAt:'2026-07-28 09:36',trialPurpose:'完成 OCR 后处理准确率、依赖兼容性和离线接口联调验证。',startDate:'2026-07-29',endDate:'2026-08-08',notes:'需开放测试数据挂载目录，测试结束后统一回收。'},{id:'RA-202607-010',name:'知识库问答服务扩容申请',type:'正式资源',department:'企业平台部 / 知识库项目组',system:'企业知识库',applicant:'周航',operator:'周航',operatorAccount:'zhou.hang',purpose:'当前问答服务峰值响应延迟超过目标，需要增加推理副本和 GPU 配额。',gpuType:'910B4',gpuCount:6,status:'已提交',createdAt:'2026-07-28 08:42',updatedAt:'2026-07-28 08:42',model:'RAG-Rerank-32B',trialPassed:'是，已完成试用验证',trialConclusion:'扩容压测显示 6 卡配置可将 P95 延迟降至 1.8 秒内。',qps:45,concurrency:120,launchTime:'2026-08-15T20:00',materials:['模型信息','部署镜像','K8s YAML','接口文档','性能测试报告'],notes:'希望保留现有 rag-prod 命名空间。'}]}
let applications=[],accounts=[],current=null,decision='approve',demoState='normal',markers=[];
function approvedTrialSeed(){return{id:'RA-202607-006',name:'视觉质检模型试用资源',type:'试用资源',department:'智能应用中心 / 多模态项目组',system:'智能质检平台',applicant:'王若尘',operator:'张三',operatorAccount:'zhang.san',purpose:'验证视觉模型在工业质检样本上的识别效果，完成离线部署和接口暴露。',gpuType:'910B4',gpuCount:4,status:'审核通过',createdAt:'2026-07-27 17:20',updatedAt:'2026-07-28 09:20',trialPurpose:'验证开源视觉模型在质检样本上的识别效果，完成离线推理链路打通。',startDate:'2026-07-29',endDate:'2026-08-12',notes:'需要 SSH 登录和 18080 测试端口。',approvalOpinion:'资源用途明确，同意试用。',allocation:{serverIp:'192.168.2.18',login:'zhang.san / SSH Key',gpuType:'910B4',gpuCount:4,expiry:'2026-08-12'}}}
function loadApplications(){try{applications=JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){applications=[]}if(!applications.length){applications=seedRequests();applications.push(approvedTrialSeed());saveApplications()}accounts=applications.filter(x=>x.status==='审核通过'&&x.type==='正式资源').map(x=>({name:x.allocation?.account||x.operatorAccount,cluster:(x.allocation?.clusters||[]).join('、')||'生产环境集群 A',time:x.updatedAt,active:true}));accounts.push({name:'demo.ops',cluster:'测试环境集群 B',time:'2026-06-18 09:20',active:false})}
function saveApplications(){localStorage.setItem(STORE_KEY,JSON.stringify(applications))}
function statusClass(s){return s==='草稿'?'draft':s==='已提交'?'pending':s==='审核中'?'reviewing':s==='审核通过'?'approved':'rejected'}
function renderTable(){if(demoState!=='normal')return renderDemoState();const kw=keyword.value.trim().toLowerCase(),type=typeFilter.value,status=statusFilter.value;const rows=applications.filter(x=>x.status!=='草稿'&&(!type||x.type===type)&&(!status||x.status===status)&&(!kw||[x.id,x.name,x.system,x.applicant,x.model||''].join(' ').toLowerCase().includes(kw)));updateCounts();if(!rows.length){tableArea.innerHTML=emptyHtml('当前筛选条件下没有申请','申请页提交资源申请后，会出现在这里。');refreshMarkers();return}tableArea.innerHTML=`<table><thead><tr><th>申请摘要</th><th>类型</th><th>业务系统</th><th>申请人 / 操作人</th><th>状态</th><th class="hide-md">提交时间</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="request"><strong title="${x.id} · ${x.purpose||''}">${x.name}</strong><small>${x.id}</small></td><td>${x.type}</td><td>${x.system}</td><td>${x.applicant}<br><small>${x.operator}</small></td><td><span class="pill ${statusClass(x.status)}">${x.status}</span></td><td class="hide-md">${x.createdAt}</td><td>${['已提交','审核中'].includes(x.status)?`<button class="link audit-btn" data-spec="A05" onclick="openDrawer('${x.id}')">审核</button>`:`<button class="link" data-spec="A05" onclick="openDrawer('${x.id}')">查看</button>`}</td></tr>`).join('')}</tbody></table>`;refreshMarkers()}
function renderDemoState(){if(demoState==='loading')tableArea.innerHTML=`<div class="state-box">正在加载审批队列…</div>`;if(demoState==='empty')tableArea.innerHTML=emptyHtml('还没有待处理申请','新的资源申请提交后会出现在这里。');if(demoState==='error')tableArea.innerHTML=`<div class="state-box"><h3>审批数据加载失败</h3><p>连接资源审批服务失败，请检查网络后重试。</p><button class="btn primary" onclick="setDemoState('normal')">重新加载</button></div>`}
function emptyHtml(t,d){return `<div class="state-box"><h3>${t}</h3><p>${d}</p><button class="btn" onclick="resetFilters()">重置筛选</button></div>`}
function setDemoState(v){demoState=v;renderTable()}function resetFilters(){keyword.value='';typeFilter.value='';statusFilter.value='';demoState='normal';document.getElementById('demoState').value='normal';renderTable()}function quickStatus(s){switchTab('approval');statusFilter.value=s;demoState='normal';document.getElementById('demoState').value='normal';renderTable()}
function switchTab(tab){const a=tab==='approval';approvalView.classList.toggle('hidden',!a);accountView.classList.toggle('hidden',a);['approvalTabBtn','approvalTabBtnMirror'].forEach(id=>document.getElementById(id)?.classList.toggle('active',a));['accountTabBtn','accountTabBtnMirror'].forEach(id=>document.getElementById(id)?.classList.toggle('active',!a));if(!a)renderAccounts();refreshMarkers()}
function openDrawer(id){current=applications.find(x=>x.id===id);if(current.status==='已提交'){current.status='审核中';current.updatedAt=now();saveApplications()}drawerTitle.textContent=current.name;drawerMeta.textContent=`${current.id} · ${current.status}`;requestKindBadge.textContent=current.type==='试用资源'?'试用申请':'正式申请';requestKindBadge.className=`request-kind ${current.type==='试用资源'?'kind-trial':'kind-formal'}`;sourceFields.innerHTML=dl(sourceRows(current));opinion.value=current.approvalOpinion||'资源用途明确，申请材料完整，同意按核定结果开通资源。';setDecision('approve');approvalOverlay.classList.remove('hidden');document.body.style.overflow='hidden';renderTable();setTimeout(refreshMarkers,20)}
function sourceRows(x){return[['申请名称',x.name],['申请部门/项目组',x.department],['业务系统',x.system],['申请人',x.applicant],['部署操作人',x.operator],...(x.type==='正式资源'?[['部署账号',x.operatorAccount]]:[]),['资源用途',x.purpose],['GPU 申请值',`${x.gpuCount} × ${x.gpuType}`],...(x.type==='试用资源'?[['试用周期',`${x.startDate||'-'} 至 ${x.endDate||'-'}`]]:[['模型名称',x.model],['是否试用通过',x.trialPassed],['预计并发',x.concurrency||'-'],['上线时间',x.launchTime||'-']])]}
function dl(rows){return rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v||'-'}</dd></div>`).join('')}
function allocationHtml(){if(decision==='reject')return '';if(current.status==='审核通过'||current.status==='已驳回')return `<div class="panel"><h3>已处理结果</h3><dl class="dl">${dl(resultRows(current))}</dl></div>`;if(current.type==='试用资源')return `<div class="panel"><h3>试用资源核定</h3><div class="form-grid"><label data-spec="A07"><span>服务器 IP *</span><input id="trialIp" value="${current.allocation?.serverIp||'192.168.2.18'}"></label><label data-spec="A08"><span>登录账号 / 方式 *</span><input id="trialLogin" value="${current.allocation?.login||`${current.operatorAccount||''} / SSH Key`}"></label><label data-spec="A09"><span>实际分配 GPU *</span><div style="display:flex;gap:7px"><input id="allocGpuCount" type="number" min="1" max="64" value="${current.allocation?.gpuCount||current.gpuCount}"><select id="allocGpuType"><option>${current.allocation?.gpuType||current.gpuType}</option><option>910B4</option><option>L40</option><option>A10</option></select></div></label><label data-spec="A10"><span>资源有效期 *</span><input id="expiry" type="date" value="${current.allocation?.expiry||current.endDate||'2026-08-12'}"></label></div></div>`;return `<div class="panel"><h3>正式资源核定与授权</h3><div class="form-grid"><label data-spec="A11"><span>授权账号 *</span><select id="authAccount"><option>${current.allocation?.account||current.operatorAccount}</option><option>chen.chen</option><option>sun.yue</option></select></label><div class="full" data-spec="A12"><span class="label">授权集群 *</span><div class="checks"><label class="check"><input type="checkbox" name="cluster" value="生产环境集群 A" checked>生产环境集群 A（可用 ${current.gpuType}：12 卡）</label><label class="check"><input type="checkbox" name="cluster" value="测试环境集群 B">测试环境集群 B（可用 A10：8 卡）</label></div></div><label class="full" data-spec="A09"><span>实际 GPU *</span><div style="display:flex;gap:7px"><input id="allocGpuCount" type="number" min="1" max="64" value="${current.allocation?.gpuCount||current.gpuCount}"><select id="allocGpuType"><option>${current.allocation?.gpuType||current.gpuType}</option><option>910B4</option><option>L40</option><option>A10</option></select></div></label></div></div>`}
function resultRows(x){return x.type==='试用资源'?[['服务器 IP',x.allocation?.serverIp||'-'],['登录方式',x.allocation?.login||'-'],['实际 GPU',`${x.allocation?.gpuCount||x.gpuCount} × ${x.allocation?.gpuType||x.gpuType}`],['有效期',x.allocation?.expiry||'-'],['审批意见',x.approvalOpinion||'-']]:[['授权账号',x.allocation?.account||'-'],['授权集群',(x.allocation?.clusters||[]).join('、')||'-'],['实际 GPU',`${x.allocation?.gpuCount||x.gpuCount} × ${x.allocation?.gpuType||x.gpuType}`],['审批意见',x.approvalOpinion||'-']]}
function namespaceBySystem(s){return s.includes('客服')?'cs-prod':s.includes('知识')?'rag-prod':'model-prod'}
function setDecision(v){decision=v;approveDecision.classList.toggle('active',v==='approve');rejectDecision.classList.toggle('active',v==='reject');allocationFields.innerHTML=allocationHtml();opinionRequired.textContent=v==='reject'?'*':'';submitApproval.textContent=v==='approve'?'审核通过并开通':'确认驳回申请';submitApproval.className=v==='approve'?'btn primary':'btn danger';submitApproval.disabled=['审核通过','已驳回'].includes(current?.status);if(v==='reject'&&!current?.approvalOpinion)opinion.value='';opinionError.textContent='';refreshMarkers()}
function validate(){opinionError.textContent='';if(['审核通过','已驳回'].includes(current.status)){showToast('该申请已处理，不能重复提交');return false}if(decision==='reject'&&opinion.value.trim().length<10){opinionError.textContent='驳回原因至少填写 10 个字，并明确需要补充的内容。';opinion.focus();return false}if(decision==='approve'){if(current.type==='试用资源'&&!/^(\d{1,3}\.){3}\d{1,3}$/.test(trialIp.value)){trialIp.focus();showToast('服务器 IP 格式不正确');return false}if(!allocGpuCount.value||Number(allocGpuCount.value)<1){allocGpuCount.focus();showToast('请填写实际分配 GPU 数量');return false}if(current.type==='正式资源'&&!document.querySelectorAll('[name=cluster]:checked').length){showToast('请选择至少一个授权集群');return false}}return true}
function submitDecision(){if(!validate())return;submitApproval.disabled=true;submitApproval.textContent='正在提交…';setTimeout(()=>{current.status=decision==='approve'?'审核通过':'已驳回';current.approvalOpinion=opinion.value.trim()||'资源用途明确，申请材料完整，同意开通。';current.updatedAt=now();if(decision==='approve'){current.allocation=current.type==='试用资源'?{serverIp:trialIp.value,login:trialLogin.value,gpuType:allocGpuType.value,gpuCount:Number(allocGpuCount.value),expiry:expiry.value}:{account:authAccount.value,clusters:[...document.querySelectorAll('[name=cluster]:checked')].map(x=>x.value),gpuType:allocGpuType.value,gpuCount:Number(allocGpuCount.value)};}saveApplications();loadApplications();closeDrawer();renderTable();showToast(decision==='approve'?'审批通过，申请页已同步开通结果':'申请已驳回并同步到申请页');submitApproval.disabled=false},600)}
function saveDraft(){localStorage.setItem('ylApprovalDraft',opinion.value);showToast('审批意见已保存为草稿')}function closeDrawer(){approvalOverlay.classList.add('hidden');document.body.style.overflow='';refreshMarkers()}function overlayClose(e){if(e.target===approvalOverlay)closeDrawer()}function now(){return '2026-07-28 '+new Date().toTimeString().slice(0,5)}
function updateCounts(){const pending=document.getElementById('pendingCount'),review=document.getElementById('reviewCount'),done=document.getElementById('doneCount');if(!pending||!review||!done)return;pending.textContent=applications.filter(x=>x.status==='已提交').length;review.textContent=applications.filter(x=>x.status==='审核中').length;done.textContent=applications.filter(x=>['审核通过','已驳回'].includes(x.status)).length}
function renderAccounts(){const kw=(document.getElementById('accountKeyword')?.value||'').trim().toLowerCase();const rows=accounts.map((a,i)=>({...a,_i:i})).filter(a=>!kw||a.name.toLowerCase().includes(kw));accountArea.innerHTML=rows.length?`<table><thead><tr><th>授权账号</th><th>授权资源</th><th>授权时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(a=>`<tr><td><strong>${a.name}</strong></td><td>${a.cluster}</td><td>${a.time}</td><td><span class="pill ${a.active?'approved':'rejected'}">${a.active?'已授权':'已停用'}</span></td><td class="account-actions"><button class="status-switch ${a.active?'':'off'}" data-spec="A17" onclick="toggleAccount(${a._i})">${a.active?'停止授权':'恢复授权'}</button><button class="link" onclick="showToast('已打开 ${a.name} 的授权详情')">查看</button></td></tr>`).join('')}</tbody></table>`:`<div class="state-box">没有匹配的授权账号</div>`;refreshMarkers()}
function toggleAccount(i){const action=accounts[i].active?'停止':'恢复';if(accounts[i].active&&!confirm(`确认停止 ${accounts[i].name} 的授权？停止后该账号将无法访问对应集群。`))return;accounts[i].active=!accounts[i].active;renderAccounts();showToast(`${action}授权成功`)}
function openAuthModal(){authModal.classList.remove('hidden');authError.textContent='';refreshMarkers()}function closeAuthModal(){authModal.classList.add('hidden');refreshMarkers()}function modalClose(e){if(e.target===authModal)closeAuthModal()}function createAuthorization(){const selected=[...document.querySelectorAll('[name=newCluster]:checked')];if(!newAccount.value||!selected.length){authError.textContent='请选择授权账号和至少一个授权集群。';return}accounts.unshift({name:newAccount.value,cluster:selected.map(x=>x.value).join('、'),time:now(),active:true});closeAuthModal();renderAccounts();showToast('账号授权已生效')}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function toggleAnnotations(){const on=!annoToggle.classList.contains('on');annoToggle.classList.toggle('on',on);annoToggle.setAttribute('aria-checked',on);annoPanel.classList.toggle('hidden',!on);on?createMarkers():removeMarkers()}function createMarkers(){removeMarkers();if(!annoToggle.classList.contains('on'))return;document.querySelectorAll('[data-spec]').forEach(el=>{if(!el.offsetParent)return;const id=el.dataset.spec,m=document.createElement('button');m.className='anno-marker';m.textContent=id.replace('A','');m.title=specs[id]?.name||id;m.onclick=e=>{e.stopPropagation();showSpec(id)};document.body.appendChild(m);markers.push({m,el})});positionMarkers()}function positionMarkers(){markers.forEach(({m,el})=>{const r=el.getBoundingClientRect();m.style.left=Math.min(innerWidth-28,r.right-8)+'px';m.style.top=Math.max(4,r.top-10)+'px'})}function removeMarkers(){markers.forEach(x=>x.m.remove());markers=[]}function refreshMarkers(){if(annoToggle.classList.contains('on'))setTimeout(createMarkers,0)}function showSpec(id){const s=specs[id];annoContent.innerHTML=`<h2 style="margin:0 0 10px;color:var(--ink)">${id} · ${s.name}</h2><dl><dt>含义</dt><dd>${s.meaning}</dd><dt>字段类型</dt><dd>${s.type}</dd><dt>是否必填</dt><dd>${s.required}</dd><dt>默认值</dt><dd>${s.def}</dd><dt>数据来源</dt><dd>${s.source}</dd><dt>限制与校验</dt><dd>${s.rules}</dd><dt>交互行为</dt><dd>${s.behavior}</dd><dt>权限与可见</dt><dd>${s.permission}</dd><dt>状态说明</dt><dd>${s.states}</dd></dl><div class="anno-tip">标注层不阻断原控件，可继续筛选、审批或打开弹窗。</div>`}function closeAnnoPanel(){annoPanel.classList.add('hidden')}
window.addEventListener('resize',positionMarkers);document.addEventListener('scroll',positionMarkers,true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeAuthModal()}});loadApplications();renderTable();updateCounts();
</script>
</body></html>
