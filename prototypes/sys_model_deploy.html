             <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-red-500 flex items-center justify-center text-sm font-bold">S</div><div><p class="text-sm font-medium">System Admin</p></div></div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white shadow-sm z-10 p-4 flex items-center">
            <h2 class="text-xl font-semibold text-gray-800">配置服务实例</h2>
            <a href="sys_model_service.html" class="text-gray-500 hover:text-blue-600 mr-4"><i class="fa-solid fa-arrow-left"></i></a>
            
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                <h3 class="text-lg font-bold text-gray-800 mb-6 border-b border-gray-100 pb-2">基础配置</h3>
                
                <div class="grid grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">服务名称</label>
                        <input type="text" value="svc-deepseek-r1-prod" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                     <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模型版本</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white">
                            <option>DeepSeek-R1 (v1.0.0)</option>
                            <option>DeepSeek-R1 (v0.9.5-beta)</option>
                        </select>
                    </div>
                </div>

                
                <div class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <label class="block text-sm font-medium text-gray-700 mb-3">算力资源池选择</label>
                    <div class="grid grid-cols-3 gap-4">
                        <label class="cursor-pointer border-2 border-blue-500 bg-blue-50 rounded-lg p-4 flex flex-col items-start relative overflow-hidden">
                            <input type="radio" name="res_pool" checked class="hidden">
                            <div class="flex justify-between w-full items-center mb-2">
                                <span class="font-bold text-gray-800">Prod Cluster A</span>
                                <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded font-bold">推荐</span>
                            </div>
                            <div class="text-xs text-gray-600 space-y-1 w-full">
                                <div class="flex justify-between"><span>NVIDIA A100:</span> <span class="font-mono font-bold text-blue-600">12/32</span></div>
                                <div class="flex justify-between"><span>NVIDIA V100:</span> <span class="font-mono text-gray-500">0/16</span></div>
                            </div>
                        </label>
                        <label class="cursor-pointer border-2 border-gray-200 rounded-lg p-4 flex flex-col items-start hover:border-blue-300 transition-colors">
                            <input type="radio" name="res_pool" class="hidden">
                            <div class="flex justify-between w-full items-center mb-2">
                                <span class="font-bold text-gray-800">Test Cluster B</span>
                            </div>
                             <div class="text-xs text-gray-600 space-y-1 w-full">
                                <div class="flex justify-between"><span>NVIDIA T4:</span> <span class="font-mono font-bold text-green-600">45/64</span></div>
                                <div class="flex justify-between"><span>NVIDIA A10:</span> <span class="font-mono font-bold text-blue-600">8/16</span></div>
                            </div>
                        </label>
                    </div>

                    <div class="mt-4 grid grid-cols-2 gap-6">
                         <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">显卡型号</label>
                            <select class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white">
                                <option>NVIDIA A100 (80GB)</option>
                                <option>NVIDIA H800</option>
                                <option>NVIDIA V100</option>
                            </select>
                         </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">副本数</label>
                            <div class="flex items-center gap-4">
                                <input type="number" value="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                <span class="text-sm text-gray-500 whitespace-nowrap">x 4 GPUs</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Advanced Config -->
                <div class="mt-6 border-t border-gray-100 pt-6">
                    <button class="flex items-center gap-2 text-sm font-bold text-gray-700 hover:text-blue-600 transition-colors" onclick="toggleAdvanced()">
                        <i class="fa-solid fa-chevron-right text-xs transition-transform" id="advancedIcon"></i>
                        <span>高级配置</span>
                    </button>
                    <div id="advancedConfig" class="hidden mt-4">
                        <textarea class="w-full h-64 bg-slate-900 text-gray-300 font-mono text-sm p-4 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" spellcheck="false">
apiVersion: serving.yinglong.io/v1alpha1
kind: ModelService
metadata:
  name: svc-deepseek-r1-prod
spec:
  model:
    name: deepseek-r1
    version: v1.0.0
  replicas: 2
  resources:
    accelerator:
      type: nvidia-a100-80g
      count: 4
  runtime:
    engine: vllm
    parameters:
      max_model_len: 32768
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.95</textarea>
                    </div>
                </div>

                 <div class="flex justify-end gap-4 pt-6">
                    <button class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">取消</button>
                    <button class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-lg">一键部署</button>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
    function toggleAdvanced() {
        const content = document.getElementById('advancedConfig');
        const icon = document.getElementById('advancedIcon');
        content.classList.toggle('hidden');
        if (content.classList.contains('hidden')) {
            icon.style.transform = 'rotate(0deg)';
        } else {
            icon.style.transform = 'rotate(90deg)';
        }
    }
</script>
<script src="assets/js/sidebar.js"></script>
</body>
</html>
